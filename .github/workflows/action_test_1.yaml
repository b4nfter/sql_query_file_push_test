name: Action Test 1

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
# schedule:
#   - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - name: Run tests
        run: |
          echo "Running tests..."
          echo "$GITHUB_EVENT_NAME"
          echo "$GITHUB_SHA"
          echo "$GITHUB_REF"
          echo "$GITHUB_ACTOR"
          echo "$GITHUB_REPOSITORY"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Checkout code
        uses: actions/checkout@v4
